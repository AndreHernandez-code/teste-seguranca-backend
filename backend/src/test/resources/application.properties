# Este arquivo SUBSTITUI (nao complementa) o application.properties principal
# durante os testes: os dois ficam na raiz do classpath e so um deles e lido.
# Toda propriedade que a aplicacao exige precisa estar aqui tambem.
#
# Foi exatamente isto que quebrou na Etapa 4: app.security.csp.politica nasceu
# so no arquivo principal, o @Value do SecurityConfig nao resolveu aqui e o
# contexto nem subiu.
#
# Ha um teste que trava isso: ConfiguracaoDeTesteTest. Se uma propriedade nova
# entrar na aplicacao, ele fica vermelho apontando o nome dela.
spring.datasource.url=jdbc:h2:mem:lavajato;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# ---- Flyway desligado nos testes (Etapa 6) ----
# Os testes usam H2 em memoria com create-drop: o schema nasce e morre a cada
# execucao, entao nao ha o que migrar. As migracoes em db/migration sao SQL de
# PostgreSQL (BIGSERIAL, NUMERIC, REFERENCES) e nem rodariam no H2 no modo
# PostgreSQL sem ajuste.
#
# O que ISSO NAO PROVA, e fica registrado: nenhum teste verifica que as
# migracoes criam um schema compativel com as entidades. Quem faz essa
# conferencia e o proprio Flyway + o ddl-auto=validate, na subida contra o
# Postgres - e foi verificado a mao na revisao da etapa, contra o banco real.
spring.flyway.enabled=false

# As demais chaves do Flyway ficam aqui com os MESMOS valores da aplicacao, so
# para o ConfiguracaoDeTesteTest continuar valendo. Sem efeito pratico enquanto
# enabled=false - mas se alguem um dia ligar o Flyway no teste, e melhor que
# ele ja venha apontado para o lugar certo do que para o padrao do Spring.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# Credencial de migracao. O valor AQUI e de teste e nao imita o da aplicacao, e
# a diferenca e o ponto: no arquivo principal estas chaves caem numa variavel de
# ambiente (DB_MIGRATION_USER/DB_MIGRATION_PASSWORD) e, sem ela, na credencial do
# datasource. Um teste que herdasse "postgres/admin" estaria testando uma
# combinacao que nao existe em lugar nenhum.
#
# Sem efeito pratico enquanto enabled=false (nao ha migracao para rodar), mas a
# chave precisa existir: se um dia alguem ligar o Flyway neste arquivo e apontar
# para um Postgres de teste, e melhor que a credencial esteja dita do que
# herdada em silencio.
spring.flyway.user=sa
spring.flyway.password=

# Admin de teste: senha conhecida para os testes de autenticacao.
app.admin.login=admin
app.admin.senha=SenhaDeTesteMuitoLonga123

# ---- Coerencia de ambiente DESLIGADA no teste (Etapa 7) ----
#
# O VerificadorDeAmbiente recusa subir se DB_PASSWORD (variavel de ambiente)
# estiver definida mas o perfil 'prod' nao estiver ativo. Isso e o
# comportamento certo em producao e o ERRADO num build: numa maquina de CI, ou
# no PC de quem exporta o ambiente de deploy, DB_PASSWORD esta definida - e a
# suite inteira quebraria por causa de uma variavel que nada tem a ver com o
# teste.
#
# Um teste que falha por causa do ambiente de quem roda e um teste que ninguem
# confia, e a primeira reacao e desligar o teste em vez de entender. Por isso a
# chave: o comportamento testado aqui e o da APLICACAO, nao o da maquina.
app.security.conferir-ambiente=false

# ---- Criacao automatica do banco: DESLIGADA, e o valor aqui e uma decisao ----
#
# Nao e so para o ConfiguracaoDeTesteTest ficar verde. Em teste o datasource e
# H2 em memoria: o banco "existe" no instante em que a JVM abre a conexao e
# desaparece quando ela morre. A ideia de "criar o banco que falta" nao tem
# sentido nenhum ali - e, se a chave viesse ligada de algum lugar, o
# CriadorDeBanco tentaria abrir uma conexao administrativa contra o H2 antes de
# o contexto subir, so para descobrir que nao ha o que criar.
#
# false e o padrao do arquivo principal tambem: quem liga o recurso e o
# INICIAR.bat, que e um contexto de instalacao, nao um teste.
app.banco.criar-se-faltar=false

# Mesmo valor do application.properties principal, para o test-run medir igual.
server.tomcat.connection-timeout=30s

# ---- Cabecalhos de seguranca (Etapa 4) ----
# O valor repete o do arquivo principal de proposito. Nao e redundancia inutil:
# e a unica forma de o @Value resolver aqui, ja que este arquivo substitui o
# outro. O HeadersSegurancaTest confere que a politica nao tem 'unsafe-inline'
# nem 'unsafe-eval' - se alguem afrouxar a CSP para "resolver" um problema,
# este e o valor que precisa mudar tambem, e o teste aponta.
app.security.csp.politica=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
app.security.hsts.max-age-segundos=15552000
app.security.hsts.include-subdominios=true

# ---- Erros e logs (Etapa 5) ----
# Estas duas FAMILIAS de propriedade precisam estar aqui porque o arquivo
# principal nao e lido nos testes (este o substitui), e o
# ConfiguracaoDeTesteTest exige a chave presente. Ver o comentario no topo.
#
# Erro: mesmos valores da aplicacao. include-stacktrace=never e o que os testes
# de nao-vazamento medem - se alguem afrouxar so no arquivo principal e nao
# aqui, o teste continua verde e a garantia some em producao. Por isso o valor
# e repetido, e nao isentado.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Log: os VALORES aqui sao de proposito diferentes dos da aplicacao.
#  - console: os testes leem a saida; mostrar INFO da aplicacao ajuda a
#    depurar um teste vermelho, e nao ha risco de vazar log de producao.
#  - arquivo: DESLIGADO. Os testes rodam centenas de vezes e um
#    logs/lavajato.log a cada execucao so encheria o diretorio do projeto com
#    lixo que ninguem le - e que o .gitignore teria que esconder.
#  - rotacao: os valores existem (o teste exige a chave) mas nao tem efeito
#    pratico sem arquivo; ficam iguais aos da aplicacao para nao parecer que
#    ha uma decisao diferente onde nao ha.
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
logging.level.root=WARN
logging.level.br.com.lavajato=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
