spring.application.name=backend
# Credenciais vem de variaveis de ambiente; o valor apos ':' e o padrao de desenvolvimento.
# Em producao, defina DB_PASSWORD (ex.: no IntelliJ: Run > Edit Configurations > Environment variables).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lavajato}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# ---- Schema: Flyway no comando, Hibernate so conferindo (Etapa 6) ----
#
# Quem CRIA e ALTERA o banco agora e o Flyway, a partir de db/migration/*.sql.
# O Hibernate apenas CONFERE que o banco bate com as entidades (validate) e
# recusa subir se nao bater.
#
# Por que nao deixar "update", como estava: com update, o Hibernate adiciona
# coluna que falta, mas NUNCA remove nem altera tipo - entao o banco real vai
# divergindo em silencio do que as entidades dizem, e a diferenca so aparece
# quando algo quebra. E numa base com dado de verdade, uma alteracao que ele
# resolva aplicar sozinho pode perder dado.
#
# Com validate, uma entidade que nao bate com o banco impede o deploy - falha
# cedo, na subida, e nao no meio do expediente.
#
# Em DESENVOLVIMENTO isto tambem vale: assim o dev ve o erro de schema na
# mesma hora, em vez de descobrir em producao. Quem precisa mexer no schema
# cria a proxima migracao.
spring.jpa.hibernate.ddl-auto=validate

# O Flyway sobe ANTES do Hibernate (por isso o validate encontra as tabelas).
# migrate-on-start aplica as migracoes pendentes; clean-disabled impede que um
# comando apague o banco por engano (o "flyway:clean" e destrutivo e nao deve
# estar a um comando de distancia numa base com dado real).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# Credencial SEPARADA para a migracao, quando existir.
#
# O usuario da aplicacao (spring.datasource) deve ter privilegio minimo: so
# CRUD, sem poder criar ou apagar tabela - ver db/usuario-minimo-privilegio.sql
# para o desenho completo e o porque. Mas o Flyway PRECISA de DDL, entao ele
# usa outra credencial.
#
# Os valores so entram se as variaveis existirem: sem elas, o Flyway cai na
# credencial do datasource (o comportamento de hoje, um usuario so), e nada
# quebra. Migrar para duas credenciais e uma decisao de instalacao, nao um
# requisito para subir.
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER:postgres}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:admin}}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- Seguranca (Etapa 1) ----
# Admin inicial: NUNCA deixe senha fixa aqui. Defina no ambiente:
#   ADMIN_LOGIN=admin  ADMIN_SENHA=<senha longa>
# Sem essas variaveis, nenhum usuario e criado e o app avisa no log.
app.admin.login=${ADMIN_LOGIN:}
app.admin.senha=${ADMIN_SENHA:}

# ---- Coerencia de ambiente (Etapa 7) ----
#
# O VerificadorDeAmbiente recusa subir quando as credenciais de producao estao
# no ambiente mas o perfil 'prod' nao esta ativo - o erro silencioso que deixaria
# o sistema no ar com cookie sem Secure.
#
# A chave existe para poder DESLIGAR essa conferencia nos testes e em CI, onde e
# normal o ambiente de deploy estar exportado. Sem ela, um DB_PASSWORD definido
# na maquina de build derrubaria a suite inteira. Ver o comentario da classe.
app.security.conferir-ambiente=true

# Cookie Secure exige HTTPS. Em dev (http://localhost) precisa ser false.
# Em producao use o perfil 'prod' (application-prod.properties), que forca true.
app.security.cookie-secure=${COOKIE_SECURE:false}

# ---- Criacao do banco na primeira subida ----
#
# O Flyway cria as TABELAS, mas nao o BANCO. Numa maquina recem-instalada, sem
# isto a subida morre com 'database "lavajato" does not exist' - que nao diz a
# quem nao conhece o projeto o que fazer.
#
# DESLIGADO por padrao, e deve continuar assim fora de instalacao: ligado, um
# erro de digitacao na URL criaria um banco vazio, o Flyway o encheria, e o
# sistema subiria "funcionando" contra uma base nova em vez de reclamar da URL
# errada. Quem liga e o INICIAR.bat, que e um contexto de instalacao explicito.
#
# Nao confunda com spring.flyway.baseline-on-migrate: aquele trata de banco que
# JA existe e nao tem historico do Flyway; este trata de banco que NAO existe.
app.banco.criar-se-faltar=${CRIAR_BANCO_SE_FALTAR:false}

# Para onde redirecionar apos logout via formulario (o SPA trata o 200 do /api/auth/logout).
app.security.logout-url=/

# ---- Forca bruta no login (Etapa 2) ----
# Limites separados porque os ataques sao diferentes: poucas tentativas bastam
# para uma conta especifica, mas um escritorio atras de um NAT precisa de folga.
app.security.login.max-tentativas-usuario=5
app.security.login.max-tentativas-ip=20
app.security.login.janela=PT15M
# false por padrao: sem um proxy confiavel na frente, confiar no cabecalho
# X-Forwarded-For deixaria o proprio cliente escolher o IP e escapar do limite.
# Ligue apenas atras de um proxy que SOBRESCREVA o cabecalho.
app.security.login.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# ---- Cabecalhos de seguranca (Etapa 4) ----
#
# CSP. Esta politica foi montada contra o front que existe hoje - e o
# HeadersSegurancaTest trava o contrato para que ele nao volte atras sozinho.
# Cada diretiva esta aqui por um motivo medido, nao por copia:
#
#  default-src 'self'  - tudo que nao for dito abaixo vem da propria origem.
#  script-src 'self'   - o front tem UM script externo (app.js) e NENHUM <script>
#                        inline, nenhum on*= nem javascript:. Por isso nao ha
#                        'unsafe-inline' aqui. Um XSS que consiga injetar HTML
#                        nao consegue executar script sem ser por um arquivo
#                        da propria origem (que o atacante nao controla).
#  style-src 'self'    - styles.css externo, nenhum style="" no HTML.
#  img-src 'self' data: - o favicon e um data:image/svg+xml embutido no HTML.
#                        Restringir a 'self' apagaria o icone da aba.
#  connect-src 'self'  - os fetch do app.js vao todos para a mesma origem.
#  object-src 'none'   - sem <object>/<embed>/<applet>; fecha uma familia
#                        inteira de plugins legados.
#  frame-ancestors 'none' - mesmo efeito do X-Frame-Options: DENY, mas com
#                        respaldo em navegador moderno. Os dois juntos cobrem
#                        navegador antigo e novo.
#  base-uri 'self'     - impede que uma injecao de <base> redirecione todos os
#                        caminhos relativos da pagina para outro host.
#  form-action 'self'  - um formulario injetado nao pode postar os dados do
#                        usuario para fora.
#
# Sem 'unsafe-inline' e sem 'unsafe-eval' de proposito: os dois sao justamente
# o que torna a CSP decorativa.
app.security.csp.politica=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'

# HSTS. O cabecalho so e emitido sob HTTPS (o writer do Spring confere
# request.isSecure()), entao em dev nao atrapalha.
#  - max-age de 180 dias, e nao o ano cheio do padrao: e um numero que da para
#    recuar sem prender os usuarios de verdade por 12 meses caso apareca um
#    problema de TLS. Suba para 31536000 quando o certificado estiver estavel.
#  - includeSubDomains=true: um subdominio esquecido em HTTP fura o HSTS do
#    dominio principal. SO LIGUE ISTO SE TODOS OS SUBDOMINIOS JA TIVEREM HTTPS -
#    se houver um "sistema.interno.empresa.com" em HTTP, ele fica INACESSIVEL
#    para quem ja recebeu o cabecalho.
app.security.hsts.max-age-segundos=15552000
app.security.hsts.include-subdominios=true

# ---- Erros e logs (Etapa 5) ----
#
# O formato {status, mensagem, campos?} e o contrato de erro da API, e o front
# depende dele. Quem garante isso e o GlobalExceptionHandler; o que esta aqui
# e a rede de seguranca do proprio Spring Boot, caso uma excecao escape dele.
#
# Nunca devolver stack trace nem mensagem de excecao ao cliente. O Boot ja
# assume esse padrao desde a 2.3, mas escrever aqui e o que segura a decisao
# diante de uma atualizacao de versao ou de alguem que sobe o nivel de log para
# investigar. Quem investiga le o LOG, nao a resposta HTTP.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Sem a pagina whitelabel: o /error responde JSON em vez de HTML.
server.error.whitelabel.enabled=false

# ---- Log ----
# Sem cor (o log vai para arquivo e para ferramenta) e sem o banner do Spring,
# que so ocupa espaco no inicio de cada subida.
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Root em WARN para o log nao encher de ruido de biblioteca; a aplicacao em
# INFO. SQL so quando SHOW_SQL=true, senao vaza consulta (e dado) no log.
logging.level.root=WARN
logging.level.br.com.lavajato=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# Arquivo de log com rotacao. max-file-size + max-history + total-size-cap
# juntos: sem o teto total, 30 arquivos de 10 MB ainda dariam 300 MB, e o erro
# classico de sistema pequeno e o disco encher e derrubar o servidor.
logging.file.name=${LOG_FILE:logs/lavajato.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB

# ---- Limite de tamanho do corpo (Etapa 3) ----
# Defesa em profundidade: os @Size dos DTOs barram texto grande campo a campo;
# isto aqui corta o corpo absurdo antes de ser desserializado. 256 KB e folgado
# para a maior requisicao real deste sistema (menos de 2 KB hoje).
# Nao use server.tomcat.max-http-form-post-size para isto: ele so vale para
# formulario urlencoded, nao para JSON.
app.security.corpo-max-bytes=262144

# Timeout de conexao do Tomcat (30s).
#
# Existe por causa de uma consequencia do filtro acima: ele roda ANTES do
# Spring Security, entao um cliente ANONIMO consegue fazer o servidor ler o
# corpo antes de levar o 401. Anunciando um Content-Length grande e mandando os
# bytes devagar, esse cliente segura uma thread do Tomcat sem estar
# autenticado. O teto de 256 KB limita a memoria, mas nao o tempo.
#
# Este valor e quem limita o tempo. Fixado aqui de proposito, em vez de herdar
# o padrao do Boot: o padrao pode mudar numa atualizacao de versao ou num
# perfil novo, e um limite que ninguem escolheu nao e um limite. 30s e o
# suficiente para o front deste sistema (requisicoes de menos de 2 KB numa rede
# local) e curto o bastante para nao render uma thread por muito tempo.
server.tomcat.connection-timeout=30s

# Tempo de vida da sessao (formato ISO-8601: PT2H = 2 horas).
server.servlet.session.timeout=PT2H

# Cookie de sessao: HttpOnly impede leitura pelo JS (mitiga roubo via XSS);
# SameSite=Lax bloqueia envio em requisicoes cross-site.
server.servlet.session.cookie.name=LAVAJATO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.path=/

