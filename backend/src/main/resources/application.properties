spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/lavajato
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Origens liberadas para chamar a API pelo navegador.
# Se o frontend for servido pelo proprio Spring Boot (http://localhost:8080),
# nenhuma destas e necessaria - o navegador considera mesma origem.
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173