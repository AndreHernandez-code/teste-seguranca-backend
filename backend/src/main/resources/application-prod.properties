# =============================================================================
# Perfil de producao. Ative com: --spring.profiles.active=prod
# =============================================================================
#
# O que muda em relacao ao dev:
#  - cookie Secure: o navegador so envia o cookie por HTTPS. Sem isto, a sessao
#    trafega em claro e pode ser capturada em rede.
#  - show-sql desligado: nao vaza consultas nem dados nos logs.
#  - ddl-auto=validate: o schema NAO e mais alterado automaticamente pela app.
#    Em producao, mudanca de schema tem que ser migracao revisada, nunca o
#    Hibernate decidindo sozinho.
#
# HTTP-only e SameSite=Lax NAO aparecem aqui de proposito: ja valem em todos os
# perfis e nao devem ser afrouxados em producao. Secure e o unico que precisa
# ser ligado, porque em dev (http://localhost) ele quebraria a sessao.
server.servlet.session.cookie.secure=true
app.security.cookie-secure=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# ---- Credenciais: obrigatorias, SEM valor padrao (Etapa 7) ----
#
# No dev estas chaves caem em padroes (postgres/admin) para nao atrapalhar quem
# acabou de clonar o repositorio. Em producao isso seria uma porta aberta: se a
# variavel faltasse, o app subiria com uma credencial conhecida por qualquer um
# que tenha lido o codigo.
#
# A sintaxe "${DB_PASSWORD}" (sem o ":valor") e o que faz isso: sem a variavel,
# a resolucao falha e a aplicacao NAO SOBE. E de proposito que seja assim -
# um deploy que para e melhor que um deploy no ar com credencial padrao.
#
# Por que escrever o mesmo padrao que ja existe no application.properties:
# porque as duas chaves herdam o valor PADRAO do arquivo base quando este nao as
# redefine. Sem estas linhas aqui, o prod herdaria "postgres" e "admin" em
# silencio - foi o que este arquivo nao cobria.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# A credencial de migracao tambem e obrigatoria em producao, e tambem sem
# padrao. Ver db/usuario-minimo-privilegio.sql: em producao o desenho e
# lavajato_migra (DDL) e lavajato_app (CRUD). Aceitar o padrao aqui faria o
# Flyway tentar migrar com o usuario de execucao - que, no desenho certo, nao
# tem privilegio de DDL nenhum.
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}

# ---- Admin inicial: exige senha forte (Etapa 7) ----
#
# Estas duas NAO tem padrao e NAO podem ter. Se faltarem, o app falha ao subir -
# e falhar e o comportamento desejado: subir sem admin significa um sistema que
# ninguem consegue administrar; subir com um admin de senha conhecida e pior.
#
# O comprimento minimo e conferido pelo AdminInicialSeeder, que agora trata
# senha curta como ERRO em producao (em dev continua sendo aviso).
app.admin.login=${ADMIN_LOGIN}
app.admin.senha=${ADMIN_SENHA}

# ---- Erros e logs (Etapa 5) ----
#
# Nunca devolver stack trace nem a mensagem da excecao ao cliente. O Spring
# Boot, por padrao, JA nao inclui o trace em resposta de erro (a propriedade
# include-stacktrace e NEVER desde o Boot 2.3), mas isto fica escrito de
# proposito: e a garantia que precisa sobreviver a uma atualizacao de versao
# ou a alguem que "sobe o perfil de debug" para investigar um problema. Quem
# investiga usa o LOG, nao a resposta HTTP.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# O /error do Boot responde em JSON; sem isto ele tentaria renderizar a pagina
# de erro HTML (whitelabel) por padrao.
server.error.whitelabel.enabled=false

# ---- Log (Etapa 5) ----
#
# Formato: hora, nivel, thread, logger, mensagem. Sem cor e sem o banner de
# inicializacao - log de servidor e lido por ferramenta, nao por olho humano.
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# A aplicacao em INFO; o Hibernate em WARN para nao encher o log com o
# "HHH000412: The JPA persistence unit..." e afins. SQL so sai se SHOW_SQL=true.
logging.level.root=WARN
logging.level.br.com.lavajato=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# Arquivo de log: sem isto, em producao o log existe so enquanto o processo
# vive - um erro de madrugada some antes de alguem ler. A rotacao evita encher
# o disco (o erro classico de sistema pequeno: log sem rotacao derruba o
# servidor por falta de espaco).
logging.file.name=${LOG_FILE:logs/lavajato.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
